<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Payment Test</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-row {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background: #5469d4;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:disabled {
            background: #879fff;
        }

        #payment-element {
            margin-bottom: 24px;
        }

        #payment-message {
            color: rgb(105, 115, 134);
            text-align: center;
            font-size: 16px;
            line-height: 20px;
            padding-top: 12px;
        }

        #payment-element .ElementsApp {
            background: white;
            padding: 20px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }
    </style>
</head>

<body>
    <h1>Test Payment</h1>
    <div class="form-row">
        <label for="amount">Amount</label>
        <input type="number" id="amount" value="100" step="0.01" min="1">
    </div>
    <div class="form-row">
        <label for="currency">Currency</label>
        <select id="currency">
            <option value="usd">USD</option>
            <option value="eur">EUR</option>
            <option value="gbp">GBP</option>
        </select>
    </div>
    <div id="payment-element"></div>
    <button id="submit">Pay now</button>
    <div id="payment-message"></div>

    <script>
        const stripe = Stripe("pk_test_51Rb80sIRfTP89krWlmNbm8K7BsZSR5gTMqUYrl0rIuFZz3erYGK3ohusMe4V7zsqG0jCguf9IqTdjZCKZgVxNCi70062yLTVmP");
        let elements;

        async function initialize() {
            const amount = document.getElementById('amount').value;
            const currency = document.getElementById('currency').value;

            const response = await fetch('http://localhost:5050/api/stripe/create-payment-intent', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    amount: parseFloat(amount),
                    currency: currency,
                    bookingId: 'test-booking-' + Date.now()
                })
            });

            const { clientSecret } = await response.json();

            elements = stripe.elements({ clientSecret });
            const paymentElement = elements.create('payment');
            paymentElement.mount('#payment-element');
        }

        async function handleSubmit(e) {
            e.preventDefault();
            setLoading(true);

            const { error } = await stripe.confirmPayment({
                elements,
                confirmParams: {
                    return_url: window.location.origin + '/payment-success.html',
                }
            });

            if (error.type === "card_error" || error.type === "validation_error") {
                showMessage(error.message);
            } else {
                showMessage("An unexpected error occurred.");
            }

            setLoading(false);
        }

        function showMessage(messageText) {
            const messageContainer = document.getElementById('payment-message');
            messageContainer.textContent = messageText;
        }

        function setLoading(isLoading) {
            const button = document.getElementById('submit');
            button.disabled = isLoading;
            button.textContent = isLoading ? 'Processing...' : 'Pay now';
        }

        document.getElementById('submit').addEventListener('click', handleSubmit);
        document.getElementById('amount').addEventListener('change', initialize);
        document.getElementById('currency').addEventListener('change', initialize);

        // Initialize on page load
        initialize();
    </script>
</body>

</html>
